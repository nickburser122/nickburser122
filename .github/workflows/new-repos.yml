name: New repositories

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      TITLE: Repositories missing from the profile page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List public repositories
        run: |
          gh api "users/$OWNER/repos?per_page=100&type=owner" --paginate --slurp | jq 'add' > repos.json

      - name: Find the ones the README does not link
        run: python scripts/missing.py "$OWNER" README.md < repos.json > body.md

      - name: Open, update or close the issue
        run: |
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -s body.md ]; then
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Every public repository is now linked from the README or listed in scripts/ignore.txt."
          fi
